---
# Grow the root volume to fill the whole disk.
#
# The VM is cloned from the ubuntu-server-base template and its virtual disk is
# resized to the requested size (e.g. 32 GB), but nothing grows the partition or
# the LVM volume inside the guest, so the OS keeps seeing the template's
# original size. Seen on 2026-10-04: a 32 GB agent reported ~14.7 GiB of
# ephemeral storage and went DiskPressure=True under parallel builds.
#
# Idempotent: every step is a no-op once the disk is fully used, so this is
# safe on a node that is already grown (e.g. the control plane). Only the
# standard Ubuntu layout (root on a single-PV LVM volume group, PV on a
# partition) is handled; anything else is skipped with a message, never failed.

- name: Install LVM and partition-growing tools
  ansible.builtin.apt:
    name:
      - cloud-guest-utils
      - lvm2
    state: present
  when: ansible_os_family == "Debian"

- name: Find the device backing /
  ansible.builtin.command: findmnt -no SOURCE /
  register: root_source
  changed_when: false

- name: Grow the root LVM volume
  when: root_source.stdout is match('^/dev/mapper/')
  block:
    - name: Find the root volume group and logical volume
      ansible.builtin.command: lvs --noheadings -o vg_name,lv_name {{ root_source.stdout }}
      register: root_lv
      changed_when: false

    - name: Find the physical volumes of the root volume group
      ansible.builtin.command: pvs --noheadings -o pv_name -S vg_name={{ root_lv.stdout.split()[0] }}
      register: root_pvs
      changed_when: false

    - name: Skip when the volume group does not have exactly one physical volume
      ansible.builtin.debug:
        msg: "Skipping root volume growth: expected 1 PV in {{ root_lv.stdout.split()[0] }}, found {{ root_pvs.stdout_lines | length }}"
      when: root_pvs.stdout_lines | length != 1

    - name: Grow the root volume
      when: root_pvs.stdout_lines | length == 1
      vars:
        root_vg: "{{ root_lv.stdout.split()[0] }}"
        root_lv_name: "{{ root_lv.stdout.split()[1] }}"
        root_pv: "{{ root_pvs.stdout | trim }}"
      block:
        - name: Find the disk and partition number of the physical volume
          ansible.builtin.shell: |
            set -o pipefail
            echo "$(lsblk -no PKNAME {{ root_pv }}) $(cat /sys/class/block/$(basename {{ root_pv }})/partition)"
          args:
            executable: /bin/bash
          register: root_pv_disk
          changed_when: false

        - name: Grow the partition to the end of the disk
          ansible.builtin.command: growpart /dev/{{ root_pv_disk.stdout.split()[0] }} {{ root_pv_disk.stdout.split()[1] }}
          register: growpart_result
          # growpart exits 1 with "NOCHANGE" when the partition already fills the disk.
          failed_when: growpart_result.rc not in [0, 1]
          changed_when: growpart_result.rc == 0

        - name: Resize the physical volume
          ansible.builtin.command: pvresize {{ root_pv }}
          register: pvresize_result
          changed_when: "'0 physical volume(s) resized' not in (pvresize_result.stdout + pvresize_result.stderr)"

        - name: Extend the root logical volume and its filesystem
          community.general.lvol:
            vg: "{{ root_vg }}"
            lv: "{{ root_lv_name }}"
            size: +100%FREE
            resizefs: true
