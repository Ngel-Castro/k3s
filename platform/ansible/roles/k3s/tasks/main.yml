- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker.io
- name: Add user to docker group
  user:
    name: "{{ admin_user }}"
    groups: docker
    append: yes
- name: Download and install K3s
  shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --disable=traefik" sh -s - --docker
  args:
    creates: /usr/local/bin/k3s
- name: Enable and start K3s service
  systemd:
    name: k3s
    enabled: yes
    state: started
- name: Create a directory if it doesn't exist
  file:
    path: "/home/{{ admin_user }}/.kube/"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: '0755'
- name: Copy Kubeconfig for the administrator user
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ admin_user }}/.kube/config"
    remote_src: yes
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: '0644'
- name: Replace 127.0.0.1 with {{ ansible_host }} in configuration file
  ansible.builtin.lineinfile:
    path: "/home/{{ admin_user }}/.kube/config"
    regexp: '127\.0\.0\.1'
    line: "    server: https://{{ ansible_host }}:6443"
    backup: yes
- name: Download and install qovery
  shell: |
    curl -s https://get.qovery.com | bash
- name: Download and install helm
  shell: |-
    curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
