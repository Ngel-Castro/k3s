- name: Download and install K3s
  shell: |
    curl -sfL https://get.k3s.io | sh -
  args:
    creates: /usr/local/bin/k3s

- name: Enable and start K3s service
  systemd:
    name: k3s
    enabled: yes
    state: started

- name: Create a directory if it doesn't exist
  file:
    path: /home/administrator/.kube/
    state: directory
    mode: '0755'

- name: Copy Kubeconfig for the administrator user
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/administrator/.kube/config
    remote_src: yes
    owner: administrator
    group: administrator
    mode: '0644'

- name: Update Kubeconfig to use localhost
  lineinfile:
    path: /home/administrator/.kube/config
    regexp: 'https://.*:6443'
    line: 'https://127.0.0.1:6443'