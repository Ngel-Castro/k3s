---
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Install curl and systemd utilities
      ansible.builtin.apt:
        name:
          - curl
          - systemd
        state: present
        update_cache: true

    - name: Create home directory for root user (used by k3s role)
      ansible.builtin.file:
        path: /home/root
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create stub k3s binary so the install step is skipped
      ansible.builtin.copy:
        dest: /usr/local/bin/k3s
        content: "#!/bin/sh\necho 'k3s stub'\n"
        mode: "0755"

    - name: Create stub k3s.service unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s.service
        content: |
          [Unit]
          Description=Lightweight Kubernetes (server)
          After=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/k3s server

          [Install]
          WantedBy=multi-user.target
        mode: "0644"

    - name: Create kube config directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Create stub kubeconfig
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/k3s.yaml
        content: |
          apiVersion: v1
          clusters:
          - cluster:
              server: https://127.0.0.1:6443
            name: default
          contexts:
          - context:
              cluster: default
              user: default
            name: default
          current-context: default
          kind: Config
          preferences: {}
          users:
          - name: default
            user:
              token: stub-token
        mode: "0600"

    - name: Reload systemd and enable k3s stub
      ansible.builtin.systemd:
        name: k3s
        daemon_reload: true
        enabled: true
