---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check that k3s binary is installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: Assert k3s binary exists
      ansible.builtin.assert:
        that: k3s_bin.stat.exists
        fail_msg: "k3s binary not found at /usr/local/bin/k3s"

    - name: Check k3s systemd unit file exists
      ansible.builtin.stat:
        path: /etc/systemd/system/k3s.service
      register: k3s_unit

    - name: Assert k3s.service unit exists
      ansible.builtin.assert:
        that: k3s_unit.stat.exists
        fail_msg: "k3s.service unit not found"

    - name: Get k3s service status
      ansible.builtin.systemd:
        name: k3s
      register: k3s_service

    - name: Assert k3s service is enabled
      ansible.builtin.assert:
        that: k3s_service.status.UnitFileState == "enabled"
        fail_msg: "k3s.service is not enabled"
