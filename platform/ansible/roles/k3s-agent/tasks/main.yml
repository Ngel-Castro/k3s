---
- name: Download and install K3s agent
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" K3S_URL="{{ k3s_server_url }}" K3S_TOKEN="{{ k3s_node_token }}" sh -s - agent
  args:
    creates: /usr/local/bin/k3s

- name: Enable and start K3s agent service
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
