---
# Size in GB of the VM's data disk, as asked of the operator and passed by
# `dante init` (-e k3s_data_disk_gb=N). 0 means the VM has none: the role does nothing.
k3s_data_disk_gb: 0  # noqa: var-naming[no-role-prefix] -- the name `dante init` passes with -e

# Where the data disk is mounted. K3s keeps containerd's images and the local-path
# volumes (so Harbor's registry data) under /var/lib/rancher.
data_disk_mount: /var/lib/rancher

# Label of the filesystem. A disk that already carries it is found again on a re-run.
data_disk_label: k3s-data

# The disk to use. Empty means find it: the labelled disk, then Proxmox's scsi1 by-id
# name, then the one blank whole disk.
data_disk_device: ""

# The by-id name Proxmox's virtio-scsi gives its second disk.
data_disk_by_id: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1

# Units that must not start without the mount.
data_disk_units:
  - k3s
  - k3s-agent
