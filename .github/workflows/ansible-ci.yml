---
name: Ansible CI

on:
  push:
    paths:
      - 'platform/ansible/**'
      - '.ansible-lint'
      - '.yamllint'
      - '.github/workflows/ansible-ci.yml'
  pull_request:
    paths:
      - 'platform/ansible/**'
      - '.ansible-lint'
      - '.yamllint'
      - '.github/workflows/ansible-ci.yml'

jobs:
  lint:
    name: ansible-lint & yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: pip install ansible-lint yamllint

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r platform/ansible/requirements.yml

      - name: Run yamllint
        run: yamllint platform/ansible/

      - name: Run ansible-lint
        run: ansible-lint platform/ansible/

  molecule-k3s-agent:
    name: Molecule — k3s-agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Molecule and dependencies
        run: pip install ansible molecule molecule-plugins[docker] docker

      - name: Run Molecule test (k3s-agent)
        working-directory: platform/ansible/roles/k3s-agent
        run: molecule test

  molecule-k3s-server:
    name: Molecule — k3s (server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Molecule and dependencies
        run: pip install ansible molecule molecule-plugins[docker] docker

      - name: Run Molecule test (k3s server)
        working-directory: platform/ansible/roles/k3s
        run: molecule test
